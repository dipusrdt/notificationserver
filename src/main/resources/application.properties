spring.application.name=MailBackend
server.port=8082

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
notification.auth.token-url=http://localhost:9000/oauth2/token
notification.auth.client-id=notification-service
notification.auth.client-secret=${NOTIFICATION_CLIENT_SECRET}
notification.auth.scope=todos.internal.read
notification.todo-api.base-url=http://localhost:8080
spring.datasource.url=jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
notification.reminder.days-ahead=1
notification.reminder.cron=0 * * * * *